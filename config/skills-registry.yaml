# SkillRunnerService는 여기에 등록된 스킬만 실행한다.
# 주문용 스킬(trader-broker 등)은 절대 등록하지 않는다 (CLAUDE.md 절대 규칙 1).
#
# 인자 치환:
#   {outputDir}  이번 실행의 reports/<runId>/<skillId>
#   {runId}      runs.id
# inputs: 앞서 성공한 스킬의 JSON 경로를 플래그로 넘긴다. 실패한 스킬은 빠진다.

runtimes:
  uv:
    project: vendor/claude-trading-skills # uv run --project <project> python <script>

skills:
  market-breadth-analyzer:
    runtime: uv
    script: vendor/claude-trading-skills/skills/market-breadth-analyzer/scripts/market_breadth_analyzer.py
    args:
      - --detail-url
      - https://tradermonty.github.io/market-breadth-analysis/market_breadth_data.csv
      - --summary-url
      - https://tradermonty.github.io/market-breadth-analysis/market_breadth_summary.csv
      - --output-dir
      - '{outputDir}'
    output: market_breadth_2*.json
    timeoutSec: 180

  uptrend-analyzer:
    runtime: uv
    script: vendor/claude-trading-skills/skills/uptrend-analyzer/scripts/uptrend_analyzer.py
    args: [--output-dir, '{outputDir}', --run-id, '{runId}']
    output: uptrend_analysis_*.json
    timeoutSec: 180

  sector-analyst:
    runtime: uv
    script: vendor/claude-trading-skills/skills/sector-analyst/scripts/analyze_sector_rotation.py
    args: [--json, --save, --output-dir, '{outputDir}']
    output: sector_rotation_*.json
    timeoutSec: 120

  exposure-coach:
    runtime: uv
    script: vendor/claude-trading-skills/skills/exposure-coach/scripts/calculate_exposure.py
    args: [--output-dir, '{outputDir}', --json-only]
    inputs:
      --breadth: market-breadth-analyzer
      --uptrend: uptrend-analyzer
      --sector: sector-analyst
    output: exposure_posture_*.json
    timeoutSec: 60

  # ④ day-trader-skill 차트 스캐너, 일봉 종가 모드만 (장중 ORB는 쓰지 않는다). 표준 라이브러리 + 야후, 키 불필요.
  # 종목 목록은 ai_daily가 symbols 테이블에서 {outputDir}/universe.txt로 미리 써 둔다.
  trader-scanner:
    runtime: python3
    script: vendor/day-trader-skill/trader-scanner/scan.py
    args: [daily, --universe, '{outputDir}/universe.txt', --out, '{outputDir}/watchlist.json', --json, --quiet]
    output: watchlist.json
    timeoutSec: 900
