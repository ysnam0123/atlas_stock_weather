# SkillRunnerService는 여기에 등록된 스킬만 실행한다.
# 주문용 스킬(trader-broker 등)은 절대 등록하지 않는다 (CLAUDE.md 절대 규칙 1).
#
# 인자 치환:
#   {outputDir}  이번 실행의 reports/<runId>/<skillId>
#   {runId}      runs.id
# inputs: 앞서 성공한 스킬의 JSON 경로를 플래그로 넘긴다. 실패한 스킬은 빠진다.

runtimes:
  uv:
    project: vendor/claude-trading-skills # uv run --project <project> python <script>
    # market-top-detector가 쓰는 거래일 달력 (pandas-market-calendars). pyproject의 선택 의존성
    extras: [market-calendar]

skills:
  market-breadth-analyzer:
    runtime: uv
    script: vendor/claude-trading-skills/skills/market-breadth-analyzer/scripts/market_breadth_analyzer.py
    args:
      - --detail-url
      - https://tradermonty.github.io/market-breadth-analysis/market_breadth_data.csv
      - --summary-url
      - https://tradermonty.github.io/market-breadth-analysis/market_breadth_summary.csv
      - --output-dir
      - '{outputDir}'
    output: market_breadth_2*.json
    timeoutSec: 180

  uptrend-analyzer:
    runtime: uv
    script: vendor/claude-trading-skills/skills/uptrend-analyzer/scripts/uptrend_analyzer.py
    args: [--output-dir, '{outputDir}', --run-id, '{runId}']
    output: uptrend_analysis_*.json
    timeoutSec: 180

  sector-analyst:
    runtime: uv
    script: vendor/claude-trading-skills/skills/sector-analyst/scripts/analyze_sector_rotation.py
    args: [--json, --save, --output-dir, '{outputDir}']
    output: sector_rotation_*.json
    timeoutSec: 120

  # FMP_API_KEY 필요 (.env). 무료 플랜은 새 주소(stable)만 되고, 막히면 야후로 받는다
  market-top-detector:
    runtime: uv
    script: vendor/claude-trading-skills/skills/market-top-detector/scripts/market_top_detector.py
    args: [--output-dir, '{outputDir}']
    output: market_top_*.json
    timeoutSec: 300

  macro-regime-detector:
    runtime: uv
    script: vendor/claude-trading-skills/skills/macro-regime-detector/scripts/macro_regime_detector.py
    args: [--output-dir, '{outputDir}']
    output: macro_regime_*.json
    timeoutSec: 300

  ftd-detector:
    runtime: uv
    script: vendor/claude-trading-skills/skills/ftd-detector/scripts/ftd_detector.py
    args: [--output-dir, '{outputDir}']
    output: ftd_detector_*.json
    timeoutSec: 180

  exposure-coach:
    runtime: uv
    script: vendor/claude-trading-skills/skills/exposure-coach/scripts/calculate_exposure.py
    args: [--output-dir, '{outputDir}', --json-only]
    inputs:
      --breadth: market-breadth-analyzer
      --uptrend: uptrend-analyzer
      --sector: sector-analyst
      --regime: macro-regime-detector
      --top-risk: market-top-detector
      --ftd: ftd-detector
    output: exposure_posture_*.json
    timeoutSec: 60

  # ④ day-trader-skill 차트 스캐너, 일봉 종가 모드만 (장중 ORB는 쓰지 않는다). 표준 라이브러리 + 야후, 키 불필요.
  # 종목 목록은 ai_daily가 symbols 테이블에서 {outputDir}/universe.txt로 미리 써 둔다.
  trader-scanner:
    runtime: python3
    script: vendor/day-trader-skill/trader-scanner/scan.py
    args: [daily, --universe, '{outputDir}/universe.txt', --out, '{outputDir}/watchlist.json', --json, --quiet]
    output: watchlist.json
    timeoutSec: 900

  # Phase 5 VCP. FMP 무료 플랜이 여러 종목 시세 요청을 막아서, 스킬 판정 로직에 Atlas 일봉을 넣는 얇은 실행기로 돌린다.
  # bars.json은 ai_daily가 이번 실행 폴더에 쓴다 (후보 + 관심 종목 + SPY, 2년 일봉). 네트워크 요청 없음
  vcp-screener:
    runtime: uv
    script: scripts/skills/vcp_local.py
    args: [--bars, '{outputDir}/bars.json', --output-dir, '{outputDir}']
    output: vcp_screener_*.json
    timeoutSec: 300

  # Phase 3 종목 소식. 표준 라이브러리 + 야후·SEC. SEC_USER_AGENT 필요 (.env). 티커는 실행할 때 붙인다
  trader-news:
    runtime: python3
    script: vendor/day-trader-skill/trader-news/news.py
    args: [--all, --hours, '72', --dry-run, --json, --no-moves, --tickers]
    output: stdout
    timeoutSec: 300

  trader-analyst:
    runtime: python3
    script: vendor/day-trader-skill/trader-analyst/facts.py
    args: [--quarters, '6', --json]
    output: stdout
    timeoutSec: 300

  # 미국 하원 의원 주식 거래 신고(PTR). 문서 목록만. 각 문서는 ptr.py fetch로 따로 읽는다 (pdftotext 필요)
  trader-pelosi-index:
    runtime: python3
    script: vendor/day-trader-skill/trader-pelosi/ptr.py
    args: [index, --json, --limit, '200', --since]
    output: stdout
    timeoutSec: 120
